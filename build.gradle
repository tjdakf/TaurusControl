plugins {
    id 'java'
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
    id 'org.beryx.jlink' version '3.0.1'
}

group = 'tauruscontrol'
version = '1.0.0'

def sdkPathProperty = 'tauruscontrol.sdk.path'
def sdkPathEnvironmentVariable = 'TAURUSCONTROL_SDK_PATH'
def configuredSdkDirectory = providers.systemProperty(sdkPathProperty)
        .orElse(providers.environmentVariable(sdkPathEnvironmentVariable))
        .orElse(layout.projectDirectory.dir('sdk/win32-x86-64').asFile.absolutePath)
def credentialsPathProperty = 'tauruscontrol.credentials.path'
def credentialsPathEnvironmentVariable = 'TAURUSCONTROL_CREDENTIALS_PATH'
def configuredCredentialsPath = providers.systemProperty(credentialsPathProperty)
        .orElse(providers.environmentVariable(credentialsPathEnvironmentVariable))
        .orElse(layout.projectDirectory.file('config/credentials.json').asFile.absolutePath)

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.json:json:20250517'
    implementation 'net.java.dev.jna:jna:5.6.0'
    implementation 'net.java.dev.jna:jna-platform:5.6.0'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.8.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.assertj:assertj-core:3.24.2'
    testImplementation 'org.skyscreamer:jsonassert:1.5.1'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

javafx {
    version = '21.0.1'
    modules = ['javafx.controls', 'javafx.fxml']
}

application {
    mainModule = 'tauruscontrol'
    mainClass = 'tauruscontrol.TaurusControlApp'
    applicationDefaultJvmArgs = ['-Dfile.encoding=UTF-8']
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

tasks.withType(JavaExec) {
    systemProperty 'file.encoding', 'UTF-8'
    systemProperty sdkPathProperty, configuredSdkDirectory.get()
    systemProperty credentialsPathProperty, configuredCredentialsPath.get()
}

processResources {
    exclude 'win32-x86-64/**'
    exclude 'templates/credentials.json'
}

test {
    useJUnitPlatform()
    systemProperty 'file.encoding', 'UTF-8'
}

jlink {
    forceMerge('org.json', 'jna', 'jna-platform')

    mergedModule {
        requires 'java.logging'
        requires 'java.desktop'
        requires 'java.datatransfer'
    }

    options = ['--strip-debug', '--compress', '2', '--no-header-files', '--no-man-pages']

    launcher {
        name = 'TaurusControl'
        jvmArgs = ['-Dfile.encoding=UTF-8']
    }

    jpackage {
        imageName = 'TaurusControl'
        installerName = 'TaurusControl'
        appVersion = '1.0.0'
        installerType = 'msi'

        imageOptions = [
                '--icon', 'src/main/resources/icon.ico'
        ]

        installerOptions = [
            '--vendor', 'TaurusControl',
            '--description', 'Taurus Series LED Terminal Manager',
            '--win-menu',
            '--win-shortcut',
            '--win-dir-chooser',
            '--icon', 'src/main/resources/icon.ico'
        ]
    }
}

// jpackageImage가 끝난 후 로컬에 설치한 SDK 런타임을 app/native 폴더로 복사
tasks.named('jpackageImage') {
    doFirst {
        File sdkDirectory = file(configuredSdkDirectory.get())
        File coreLibrary = new File(sdkDirectory, 'viplexcore.dll')
        if (!coreLibrary.isFile()) {
            throw new GradleException(
                    "NovaStar T-SDK 런타임을 찾을 수 없습니다: ${coreLibrary}. " +
                            "-D${sdkPathProperty}=<path> 또는 ${sdkPathEnvironmentVariable}로 " +
                            "T-SDK 3.6.3.0101 Windows x64 경로를 지정하세요."
            )
        }
    }

    doLast {
        copy {
            from configuredSdkDirectory
            into "$buildDir/jpackage/TaurusControl/app/native"
            exclude 'apitestcases/**'
        }
    }
}
